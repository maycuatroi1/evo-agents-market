# CI of the evo-agents market index.
#
# On every pull request, on main and once a week, `evo-agents plugin market-check market.json --releases` checks
# market.json against plugin-market-v1 (each id listed once, each paid plugin naming a seller the index lists, each
# core plugin naming its package), then downloads the latest GitHub Release of each free isolated plugin and checks
# that its bundle is that plugin at that version, by the publisher the index names, signed by the signer the index
# names. The weekly run catches a plugin whose newest release no longer matches its entry.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # evo-ak from the nightly tag of evo-agents, the newest commit of main whose CI passed, as the plugin template's CI
  # installs it, so the index is checked by the reader hubs get next.
  EVO_AK: evo-ak @ git+https://github.com/maycuatroi1/evo-agents@nightly
  # The sigstore package checks keyless signatures; evo-ak brings it only with its hub-server extra.
  SIGSTORE: sigstore==4.5.0
  PYTHON: "3.12"

jobs:
  market-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Python
        run: |
          uv venv --seed --python "$PYTHON" "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
      - name: Install evo-ak and sigstore
        run: python -m pip install --disable-pip-version-check "$EVO_AK" "$SIGSTORE"
      - name: market.json against plugin-market-v1, and the signed release of each free plugin
        env:
          GITHUB_TOKEN: ${{ github.token }} # reads public releases with the API's higher rate limit
        run: evo-agents plugin market-check market.json --releases
